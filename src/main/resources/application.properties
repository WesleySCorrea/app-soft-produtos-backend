spring.application.name=app-soft-produtos-backend
server.port=9091

spring.datasource.url=jdbc:postgresql://localhost:8746/produtos
spring.datasource.username=produtos
spring.datasource.password=produtos

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=localhost:9092

# consumer (lê pedido-criado)
spring.kafka.consumer.group-id=produtos

# producer (envia pedido-resultado)
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/app-soft